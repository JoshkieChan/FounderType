language: en-US

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - '!node_modules/**'
    - '!web-build/**'
    - '!.expo/**'
    - '!.expo-shared/**'
    - '!coverage/**'
    - '!dist/**'
    - '!build/**'
    - '!*.map'
    - '!*.lock'
    - '!package-lock.json'
  path_instructions:
    - path: '**/*.{ts,tsx,js,jsx}'
      instructions: >
        Review for React Native and Expo web/native regressions, type safety,
        error boundaries, navigation correctness, environment handling, and
        code paths that could white-screen production.
    - path: 'supabase/**'
      instructions: >
        Review migrations, RLS policies, Edge Functions, and database access for
        privilege escalation, broad anonymous writes, missing server-side
        validation, and launch-scale data integrity issues.
    - path: 'lib/**/*'
      instructions: >
        Pay close attention to auth/session handling, public bundle secrets,
        Supabase client usage, caching behavior, and production failure modes.
    - path: 'screens/**/*'
      instructions: >
        Review user-facing UI/UX flows for broken navigation, inaccessible
        states, loading/error handling, and web/mobile layout mismatches.
    - path: 'vercel.json'
      instructions: >
        Verify Vercel build, routing, caching, and environment behavior for
        Expo web production deployments.

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
  learnings:
    scope: auto
