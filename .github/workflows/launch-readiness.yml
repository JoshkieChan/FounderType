name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Expo dependency check
        run: npm run expo:check

      - name: Expo Doctor
        run: npm run expo:doctor

      - name: Test
        run: npm test -- --runInBand

      - name: Database security tests
        run: npm run test:database

      - name: Edge function tests
        run: npm run test:edge

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Check Edge function entry points
        run: deno check supabase/functions/hcaptcha-verify/index.ts supabase/functions/send-email/index.ts

      - name: Build web
        run: npm run build

      - name: Smoke local web build
        run: |
          npm run serve:web &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4177/ >/dev/null; then
              break
            fi
            sleep 1
          done
          SMOKE_BASE_URL=http://127.0.0.1:4177 npm run smoke:web

      - name: Browser regression tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Dependency audit with expiring upstream exceptions
        run: npm run audit:dependencies

permissions:
  contents: read
